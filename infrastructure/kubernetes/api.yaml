apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata: { name: api, namespace: devsync }
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector: { matchLabels: { app: devsync-api } }
  strategy:
    canary:
      stableService: api-stable
      canaryService: api-canary
      trafficRouting: { nginx: { stableIngress: api } }
      steps:
        - setWeight: 10
        - pause: { duration: 5m }
        - analysis: { templates: [{ templateName: otel-http-success-rate }], args: [{ name: service, value: devsync-api }] }
        - setWeight: 100
  template:
    metadata: { labels: { app: devsync-api } }
    spec:
      containers:
        - name: api
          image: ghcr.io/kevinbastin/devsync-api:main
          ports: [{ containerPort: 5000 }]
          envFrom: [{ secretRef: { name: devsync-runtime } }]
          readinessProbe: { httpGet: { path: /api/ready, port: 5000 }, initialDelaySeconds: 10 }
          livenessProbe: { httpGet: { path: /api/health, port: 5000 }, initialDelaySeconds: 15 }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: '1', memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: api-stable, namespace: devsync }
spec: { selector: { app: devsync-api }, ports: [{ port: 80, targetPort: 5000 }] }
---
apiVersion: v1
kind: Service
metadata: { name: api-canary, namespace: devsync }
spec: { selector: { app: devsync-api }, ports: [{ port: 80, targetPort: 5000 }] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: api, namespace: devsync }
spec:
  ingressClassName: nginx
  rules: [{ http: { paths: [{ path: /api, pathType: Prefix, backend: { service: { name: api-stable, port: { number: 80 } } } }] } }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: api, namespace: devsync }
spec:
  scaleTargetRef: { apiVersion: argoproj.io/v1alpha1, kind: Rollout, name: api }
  minReplicas: 3
  maxReplicas: 12
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } } }]
