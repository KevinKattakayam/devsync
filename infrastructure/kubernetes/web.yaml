apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata: { name: web, namespace: devsync }
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector: { matchLabels: { app: devsync-web } }
  strategy:
    canary:
      stableService: web-stable
      canaryService: web-canary
      trafficRouting: { nginx: { stableIngress: web } }
      steps:
        - setWeight: 10
        - pause: { duration: 5m }
        - analysis: { templates: [{ templateName: otel-http-success-rate }], args: [{ name: service, value: devsync-web }] }
        - setWeight: 100
  template:
    metadata: { labels: { app: devsync-web } }
    spec:
      containers:
        - name: web
          image: ghcr.io/kevinbastin/devsync-web:main
          ports: [{ containerPort: 3000 }]
          envFrom: [{ secretRef: { name: devsync-runtime } }]
          readinessProbe: { httpGet: { path: /, port: 3000 }, initialDelaySeconds: 10 }
          livenessProbe: { httpGet: { path: /, port: 3000 }, initialDelaySeconds: 20 }
          resources: { requests: { cpu: 150m, memory: 256Mi }, limits: { cpu: '1', memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: web-stable, namespace: devsync }
spec: { selector: { app: devsync-web }, ports: [{ port: 80, targetPort: 3000 }] }
---
apiVersion: v1
kind: Service
metadata: { name: web-canary, namespace: devsync }
spec: { selector: { app: devsync-web }, ports: [{ port: 80, targetPort: 3000 }] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: web, namespace: devsync }
spec:
  ingressClassName: nginx
  rules: [{ http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: web-stable, port: { number: 80 } } } }] } }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: web, namespace: devsync }
spec:
  scaleTargetRef: { apiVersion: argoproj.io/v1alpha1, kind: Rollout, name: web }
  minReplicas: 3
  maxReplicas: 15
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } } }]
