# Local development stack only. Production uses explicit private environment settings.
services:
  bootstrap:
    build:
      context: ./backend
      target: tooling
    command: [node, docker/bootstrap.mjs]
    volumes:
      - admin_credentials:/state/admin
      - runtime_credentials:/state/runtime
    restart: 'no'

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: devsync_admin
      POSTGRES_PASSWORD_FILE: /run/admin/postgres-password
      POSTGRES_DB: devsync
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - admin_credentials:/run/admin:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, pg_isready -U devsync_admin -d devsync]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory, 256mb, --maxmemory-policy, noeviction]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  initialize:
    build:
      context: ./backend
      target: tooling
    command: [node, docker/initialize.mjs]
    environment:
      DEPLOYMENT_MODE: local
      SEED_OWNER_CLERK_ID: ${SEED_OWNER_CLERK_ID:-user_local_owner}
      SEED_EDITOR_CLERK_ID: ${SEED_EDITOR_CLERK_ID:-user_local_editor}
      SEED_VIEWER_CLERK_ID: ${SEED_VIEWER_CLERK_ID:-user_local_viewer}
    volumes:
      - admin_credentials:/state/admin:ro
      - runtime_credentials:/state/runtime:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  backend:
    build:
      context: ./backend
      target: runner
    environment:
      DEPLOYMENT_MODE: local
      PORT: '5000'
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      OTEL_SDK_DISABLED: 'true'
    volumes:
      - runtime_credentials:/state/runtime:ro
    ports:
      - 127.0.0.1:${BACKEND_PORT:-5000}:5000
    depends_on:
      initialize:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    init: true
    stop_grace_period: 30s

  worker:
    build:
      context: ./backend
      target: runner
    command: [node, dist/worker.js]
    environment:
      DEPLOYMENT_MODE: local
      PROCESS_ROLE: worker
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      OTEL_SDK_DISABLED: 'true'
    volumes:
      - runtime_credentials:/state/runtime:ro
    depends_on:
      backend:
        condition: service_healthy
    init: true
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        DEPLOYMENT_MODE: local
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-5000}/api
        NEXT_PUBLIC_SOCKET_URL: http://localhost:${BACKEND_PORT:-5000}
        NEXT_PUBLIC_YJS_URL: ws://localhost:${BACKEND_PORT:-5000}
        BACKEND_URL: http://backend:5000
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    ports:
      - 127.0.0.1:${FRONTEND_PORT:-3000}:3000
    depends_on:
      backend:
        condition: service_healthy
    init: true
    stop_grace_period: 30s

volumes:
  postgres_data:
  redis_data:
  admin_credentials:
  runtime_credentials:
