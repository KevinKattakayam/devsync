name: Build, Test, Scan, and Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/devsync-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/devsync-web

jobs:
  quality:
    name: Install, lint, format, types, tests, contracts and build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: devsync_test
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: devsync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devsync_test -d devsync_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://devsync_test:ci-only-test-password@localhost:5432/devsync_test?connect_timeout=3
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      OTEL_SDK_DISABLED: 'true'
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run openapi:check
        if: matrix.service == 'backend'
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always() && matrix.service == 'backend'
        with:
          name: backend-coverage-${{ github.sha }}
          path: backend/coverage/
          if-no-files-found: warn

  image-security:
    name: Build, scan, SBOM, and publish
    needs: quality
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            image: ghcr.io/${{ github.repository_owner }}/devsync-api
          - service: frontend
            image: ghcr.io/${{ github.repository_owner }}/devsync-web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image to local Docker cache
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          load: true
          push: false
          tags: ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Block HIGH and CRITICAL CVEs
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ matrix.image }}:${{ github.sha }}
          format: template
          template: '@contrib/sarif.tpl'
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Upload vulnerability results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ matrix.image }}:${{ github.sha }}
          format: cyclonedx
          output: sbom-${{ matrix.service }}.cdx.json
          exit-code: '0'
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}-${{ github.sha }}
          path: sbom-${{ matrix.service }}.cdx.json
          if-no-files-found: error
          retention-days: 365
      - name: Publish immutable image
        if: github.event_name == 'push'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:main
          cache-from: type=gha
      - name: Create SLSA build attestation
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
